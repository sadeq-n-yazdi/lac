version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - dupl
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - wastedassign
    - whitespace

  settings:
    dupl:
      threshold: 150
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
        - opinionated
        - performance
        - style
      disabled-checks:
        - whyNoLint
    govet:
      enable-all: true
      disable:
        - fieldalignment
    misspell:
      locale: UK
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: indent-error-flow
        - name: var-naming
        - name: package-comments

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Tests may repeat themselves and take shortcuts that production code may not.
      - path: _test\.go$
        linters:
          - dupl
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - code.sadeq.uk/lac
