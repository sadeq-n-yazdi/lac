version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - dupl
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - wastedassign
    - whitespace

  settings:
    dupl:
      threshold: 150
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
        - opinionated
        - performance
        - style
      disabled-checks:
        - whyNoLint
      settings:
        hugeParam:
          # Domain types and the configuration are passed by value on purpose: they are immutable
          # snapshots, and a pointer would invite a caller to mutate something another goroutine is
          # reading. None of them is copied in a hot loop.
          sizeThreshold: 512
        rangeValCopy:
          # Same reasoning, and these ranges are over a handful of agents or leases, never a
          # hot loop.
          sizeThreshold: 256
    govet:
      enable-all: true
      disable:
        - fieldalignment
        # `if err := f(); err != nil` is the idiom, and shadow flags every one of them.
        - shadow
    misspell:
      locale: UK
      # MCP's method and field names are fixed by its specification, and spelling them the British
      # way would simply break the protocol.
      ignore-rules:
        - initialize
        - initialized
        - serialize
        - serialized
        # Telegram's own error text, quoted verbatim in a test fixture.
        - unauthorized
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: indent-error-flow
        - name: var-naming
        - name: package-comments

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Tests may repeat themselves and take shortcuts that production code may not: a test
      # connection is short-lived and bounded by the test's own deadline.
      - path: _test\.go$
        linters:
          - dupl
          - gosec
          - noctx
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - sadeq.uk/lac
